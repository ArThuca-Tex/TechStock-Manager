{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">TERMINAL DE VENDAS</span><h1>Frente de caixa</h1><p>Produtos físicos e licenças em um único pedido.</p></div></div>
<form method="post" id="checkout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="two-col"><section class="form-card"><h2>Monte o carrinho</h2><label>Buscar produto<input id="busca" type="search" placeholder="Nome ou SKU"></label><label>Produto<select id="produto"><option value="">Selecione um produto</option>{% for p in produtos %}<option value="{{ p.id_produto }}" data-preco="{{ p.preco_venda }}" data-saldo="{{ p.estoque_atual }}">{{ p.sku }} · {{ p.nome }} · {{ p.classificacao }} · R$ {{ '%.2f'|format(p.preco_venda) }} · saldo {{ p.estoque_atual }}</option>{% endfor %}</select></label><label>Quantidade<input id="qtd" type="number" value="1" min="1" max="1000000"></label><button type="button" id="adicionar" class="button secondary">Adicionar ao carrinho</button><p id="erro" role="alert" class="danger-text"></p><div id="carrinho"></div><h2 aria-live="polite">Total: <span id="total">R$ 0,00</span></h2></section><section class="form-card"><h2>Cliente e pagamento</h2><label>Nome / razão social<input name="cliente_nome" required maxlength="160" value="{{ request.form.get('cliente_nome', '') }}"></label><label>CPF / CNPJ<input name="cliente_documento" required maxlength="18" value="{{ request.form.get('cliente_documento', '') }}"></label><label>Forma de pagamento<select name="forma_pagamento" required><option value="PIX">PIX</option><option value="CARTAO_CREDITO">Cartão de crédito</option><option value="BOLETO_FATURADO">Boleto faturado</option></select></label><p class="hint">O estoque e os preços serão conferidos novamente na confirmação.</p><button id="confirmar" class="button primary full-button" disabled>Confirmar venda</button></section></div></form><script src="{{ url_for('static', filename='js/pdv.js') }}" defer></script>{% endblock %}
